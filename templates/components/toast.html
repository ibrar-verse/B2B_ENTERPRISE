<div x-data="toastCenter()" x-init="init()" class="fixed right-4 top-24 z-50 space-y-3">
  <template x-for="toast in toasts" :key="toast.id">
    <div class="w-80 rounded-2xl border border-slate-200 bg-white p-4 shadow-soft">
      <div class="flex items-start justify-between gap-3">
        <div>
          <div class="text-sm font-bold text-slate-900" x-text="toast.title"></div>
          <div class="mt-1 text-sm text-slate-600" x-text="toast.message"></div>
        </div>
        <button type="button" class="text-slate-400 hover:text-slate-700" @click="dismiss(toast.id)">×</button>
      </div>
    </div>
  </template>
</div>

{% if messages %}
  <div class="fixed right-4 top-24 z-50 space-y-3">
    {% for message in messages %}
      <div class="w-80 rounded-2xl border px-4 py-4 shadow-soft {% if message.tags == 'error' %}border-rose-200 bg-rose-50 text-rose-700{% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800{% else %}border-emerald-200 bg-emerald-50 text-emerald-700{% endif %}">
        <div class="text-sm font-bold">{% if message.tags == 'error' %}Error{% elif message.tags == 'warning' %}Notice{% else %}Success{% endif %}</div>
        <div class="mt-1 text-sm">{{ message }}</div>
      </div>
    {% endfor %}
  </div>
{% endif %}
