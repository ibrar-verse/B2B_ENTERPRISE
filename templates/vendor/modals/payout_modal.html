<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4"
     x-data="{ open: true }" 
     x-show="open" 
     @keydown.escape.window="open = false; $el.remove()">
     
    <div class="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-6 shadow-xl space-y-5" @click.away="open = false; $el.remove()">
        <div class="flex items-center justify-between border-b border-slate-100 pb-4">
            <div>
                <h3 class="text-lg font-bold text-slate-900">Request Bank Payout</h3>
                <p class="text-xs text-slate-500">Disburse settled funds directly to your 1Link IBAN.</p>
            </div>
            <button @click="open = false; $el.closest('.fixed').remove()" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
        </div>

        {% if success_message %}
            <div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-4 text-xs font-semibold text-emerald-700">
                {{ success_message }}
            </div>
            <button @click="open = false; $el.closest('.fixed').remove()" class="w-full rounded-2xl bg-slate-900 px-4 py-2.5 text-xs font-semibold text-white">
                Done
            </button>
        {% else %}
            <form hx-post="{% url 'vendor-payout' %}" hx-target="#modal-container" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Withdrawal Amount (PKR)</label>
                    <input type="number" step="0.01" name="amount" required placeholder="50000.00"
                           class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Beneficiary IBAN / Bank Account</label>
                    <input type="text" name="iban" required placeholder="PK00MEZN0001234567890101"
                           class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100">
                </div>
                
                <button type="submit" class="w-full rounded-2xl bg-emerald-600 px-4 py-3 text-xs font-semibold text-white shadow-sm hover:bg-emerald-700 transition">
                    Submit Payout Request →
                </button>
            </form>
        {% endif %}
    </div>
</div>
