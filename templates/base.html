<!DOCTYPE html>
<html lang="en" class="h-full scroll-smooth bg-[var(--canvas)] text-slate-900 antialiased selection:bg-emerald-200 selection:text-emerald-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Enterprise Marketplace{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          fontFamily: {
            sans: ['Manrope', 'ui-sans-serif', 'system-ui'],
          },
          extend: {
            colors: {
              brand: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#34d399',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
              },
              slateCanvas: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                700: '#334155',
                900: '#0f172a',
              }
            },
            boxShadow: {
              'soft': '0 24px 60px -28px rgba(15, 23, 42, 0.18)',
              'card': '0 18px 50px -24px rgba(15, 23, 42, 0.14)',
            }
          }
        }
      }
    </script>

    <!-- HTMX & Alpine.js -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
      :root {
        --canvas: #f8fafc;
        --surface: rgba(255, 255, 255, 0.86);
        --surface-solid: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #475569;
        --brand: #059669;
      }

      body {
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(16, 185, 129, 0.08), transparent 30%),
          radial-gradient(circle at 85% 0%, rgba(14, 165, 233, 0.05), transparent 26%),
          linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      }

      .ambient-halo {
        position: fixed;
        inset: -8rem auto auto 50%;
        transform: translateX(-50%);
        width: min(72rem, 90vw);
        height: 22rem;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(16, 185, 129, 0.04) 35%, rgba(255, 255, 255, 0) 72%);
        filter: blur(72px);
        pointer-events: none;
        z-index: 0;
      }

      .surface-card {
        background: var(--surface);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border);
      }

      .htmx-indicator { display: none; }
      .htmx-request .htmx-indicator { display: inline-flex; }
      .htmx-request.htmx-indicator { display: inline-flex; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden font-sans text-slate-900"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
      x-data="{ cartOpen: false, modalOpen: false }">

    <!-- Ambient layer -->
    <div class="ambient-halo"></div>

    {% include 'components/navbar.html' %}
    {% include 'components/toast.html' %}

    <main class="flex-1 relative z-10 pt-28 pb-16 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Modal Injection Container -->
    <div id="modal-container"></div>

    <script>
      document.addEventListener('alpine:init', function() {
        Alpine.data('toastCenter', function() {
          return {
            toasts: [],
            init() {
              document.body.addEventListener('showToast', (event) => {
                const payload = event.detail || {};
                const id = Date.now() + Math.random();
                this.toasts.push({
                  id,
                  type: payload.type || 'success',
                  title: payload.title || 'Update',
                  message: payload.message || '',
                });
                setTimeout(() => this.dismiss(id), 3500);
              });
            },
            dismiss(id) {
              this.toasts = this.toasts.filter((toast) => toast.id !== id);
            },
          };
        });
      });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
