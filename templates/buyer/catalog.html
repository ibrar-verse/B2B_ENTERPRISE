{% extends 'base.html' %}

{% block title %}Enterprise Catalog | AURA Marketplace{% endblock %}

{% block content %}
<div class="space-y-8 max-w-7xl mx-auto py-4">
    <!-- Header & Search Bar -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Enterprise Procurement Catalog</h1>
            <p class="text-sm text-slate-500 mt-1">Direct bulk inventory from verified suppliers.</p>
        </div>
        
        <div class="w-full md:w-80">
            <input type="text" 
                   name="q" 
                   value="{{ query }}"
                   placeholder="Search SKU, name, or supplier..." 
                   hx-get="{% url 'buyer-catalog' %}" 
                   hx-trigger="keyup changed delay:300ms, search" 
                   hx-target="#catalog-grid" 
                   hx-indicator=".search-indicator"
                   class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white shadow-sm">
        </div>
    </div>

    <!-- Product Grid Partial Container -->
    <div id="catalog-grid">
        {% include 'partials/catalog_grid.html' %}
    </div>
</div>
{% endblock %}
