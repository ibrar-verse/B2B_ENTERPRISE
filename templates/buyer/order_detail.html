{% extends 'base.html' %}

{% block title %}Order #{{ order.id }} | Enterprise Marketplace{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto space-y-6 py-4">
    <div class="flex items-center justify-between">
        <a href="{% url 'buyer-orders' %}" class="text-xs font-semibold text-slate-500 hover:text-emerald-700 transition">
            ← Back to Purchase Orders
        </a>
        <span class="text-xs font-semibold text-slate-500">Order ID: #{{ order.id }}</span>
    </div>

    {% include 'partials/order_status_card.html' with order=order error_message=error_message %}
</div>
{% endblock %}
